          - UHV chamber design (SolidWorks, ~290-body assembly).
          - Laser cooling and trapping; PDH locks; custom diode laser assembly.
          - FPGA control on Red Pitaya (PyRPL-based PID, band-pass filters).
          - Custom water-cooled Helmholtz coil engineering with external vendors.
          - Cleanroom nanofabrication of photonic-crystal defect cavities.

