cv:
  name: Pritwish Agarwal
  label: PhD researcher in cold atoms and nanocavity QED
  email: pritwish@chalmers.se
  location: Gothenburg, Sweden
  image: ""
  summary: PhD researcher at the Hybrid Quantum Systems Laboratory, Chalmers University of Technology — the first strontium-atom experiment in Sweden. Building a hybrid platform that couples a single Sr-88 atom in an optical tweezer to a Si₃N₄ photonic-crystal defect cavity at 689 nm, with the aim of mediating coherent atom-phonon interactions for macroscopic quantum state generation.

